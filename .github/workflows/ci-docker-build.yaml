name: Reusable Insurance Docker Build

on:
  workflow_call:
    outputs:
      image_tag:
        value: ${{ jobs.build.outputs.image_tag }}
      failure_stage:
        value: ${{ jobs.build.outputs.failure_stage }}
      report_url:
        value: ${{ jobs.build.outputs.report_url }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      failure_stage: ${{ steps.failure.outputs.stage }}
      report_url: ${{ steps.report.outputs.url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - id: meta
        name: Generate image tag
        run: |
          TAG=${GITHUB_SHA::7}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - id: report
        name: Generate workflow report url
        run: |
          echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Prepare image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/insurance-policy-service" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t ${{ steps.image.outputs.image }}:${{ steps.meta.outputs.tag }} \
            -f Dockerfile \
            .

      - name: Push image
        id: push
        run: |
          SUCCESS=false

          for i in 1 2 3; do
            docker push ${{ steps.image.outputs.image }}:${{ steps.meta.outputs.tag }} && SUCCESS=true && break
            echo "Push attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "Docker push failed after retries."
            exit 1
          fi

      - id: failure
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "stage=image_build_failed" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.push.outcome }}" = "failure" ]; then
            echo "stage=image_push_failed" >> "$GITHUB_OUTPUT"
          else
            echo "stage=success" >> "$GITHUB_OUTPUT"
          fi